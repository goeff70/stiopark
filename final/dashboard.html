<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="oPark browser-only parking reservation demo."
    />
    <title>oPark Demo Dashboard</title>
    <link rel="stylesheet" href="./src/login/style.css" />
    <link rel="stylesheet" href="./src/demo-auth.css" />
    <link rel="stylesheet" href="./src/demo-dashboard.css" />
    <script type="module" src="./src/demo-dashboard.js"></script>
  </head>
  <body>
    <main id="root">
      <header class="dashboard-header">
        <nav class="dashboard-nav" aria-label="Main navigation">
          <ul>
            <li><a href="#" id="signout-button">Logout</a></li>
            <li><a href="#about" data-info="about">About</a></li>
            <li><a href="#contact" data-info="contact">Contact</a></li>
            <li><a href="#services" data-info="services">Services</a></li>
            <li><span class="dashboard-user" id="dashboard-user-name"></span></li>
          </ul>
        </nav>
      </header>

      <div class="statusLegend" aria-label="Parking status legend">
        <div class="legendItem">
          <img src="./src/assets/green-square.svg" alt="" class="legendIcon" />
          <span>Vacant</span>
        </div>
        <div class="legendItem">
          <img src="./src/assets/red-square.svg" alt="" class="legendIcon" />
          <span>Occupied</span>
        </div>
        <div class="legendItem">
          <img src="./src/assets/blue-square.svg" alt="" class="legendIcon" />
          <span>Reserved</span>
        </div>
        <aside class="demo-notice">
          Demo only: lane availability and reservations are stored in this browser,
          not live or connected to parking sensors.
        </aside>
      </div>

      <p id="dashboard-message" class="dashboard-message" role="status" aria-live="polite" hidden>
        <span class="dashboard-message-content"></span>
      </p>
      <section id="lane-list" class="lanesContainer" aria-label="Parking lanes" aria-live="polite"></section>
      <footer>
        <p>&copy; <span id="current-year"></span> STI College Malaybalay · Browser demo only</p>
      </footer>

      <dialog id="reservation-dialog" class="reservation-dialog">
        <form id="reservation-form">
          <h2 id="reservation-title">Reserve a lane</h2>
          <p class="dialog-help">Choose a purpose and reservation time.</p>
          <p id="reservation-error" class="form-error" role="alert" hidden></p>

          <label for="reservation-purpose">Purpose</label>
          <select id="reservation-purpose" class="input-field select-field" required>
            <option value="" selected disabled>Select a purpose</option>
            <option value="Enrollment">Enrollment</option>
            <option value="Payment">Payment</option>
            <option value="Classes">Classes</option>
            <option value="TESDA">TESDA</option>
            <option value="Other">Other</option>
          </select>

          <label for="reservation-start">Start</label>
          <input id="reservation-start" class="input-field" type="datetime-local" required />
          <label for="reservation-end">End</label>
          <input id="reservation-end" class="input-field" type="datetime-local" required />

          <div class="dialog-actions">
            <button type="button" class="dialog-cancel" id="close-dialog">Cancel</button>
            <button type="submit" class="form-btn form-btn--submit">Confirm reservation</button>
          </div>
        </form>
      </dialog>

      <dialog id="info-dialog" class="info-dialog">
        <h2 id="info-title"></h2>
        <p id="info-message"></p>
        <button type="button" id="close-info-dialog">Close</button>
      </dialog>
    </main>
  </body>
</html>
